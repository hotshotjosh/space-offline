[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license-file = "../LICENSE.md"
publish = false
rust-version = "1.93"

# External crates only by owner decision (docs/reference/dependencies.md): each
# one is a row in server/deps.allow, a librust-*-dev line in the build image,
# and a digest in server/deps.digest. Versions are what the image's apt
# registry carries.
[workspace.dependencies]
getrandom = { version = "0.2.15", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = "line-tables-only"
